<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Source for public/og-image.jpg — the card every Facebook and X share
      shows. Rendered to a 1200x630 JPEG by scripts/build-og-image.mjs.

      Kept as HTML rather than a binary-only asset so the wording and the brand
      can be corrected later without redrawing anything by hand.

      The mark is Aunt Mabel's real sepia portrait, not the "M" letter. In a
      feed this card competes with photographs of people, and a face — a real
      one, warm, mid-smile — is what earns the half-second of attention. The "M"
      stays where a face at 32px would be unreadable: the favicon.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Franklin:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #f6efe2;
        font-family: 'Libre Franklin', system-ui, sans-serif;
        font-weight: 300;
        color: #2d2417;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 60px 72px;
        position: relative;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* A soft rose bloom, bottom-right — warmth without competing with the
         headline or the portrait. */
      .bloom {
        position: absolute;
        right: -200px;
        bottom: -260px;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(194, 91, 80, 0.15) 0%, rgba(194, 91, 80, 0) 70%);
      }

      .top {
        position: relative;
        display: flex;
        align-items: center;
        gap: 46px;
        flex: 1;
      }

      .portrait {
        width: 268px;
        height: 268px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid #fbf7ee;
        box-shadow: 0 24px 48px -22px rgba(45, 36, 23, 0.5);
        flex: none;
      }

      .headline {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 400;
        font-size: 58px;
        line-height: 1.13;
        letter-spacing: -0.02em;
      }
      .headline em { font-style: italic; color: #c25b50; }

      .wordmark {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 26px;
        color: #6b5d48;
        margin-bottom: 14px;
        letter-spacing: 0.01em;
      }

      .bottom {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 30px;
        padding-top: 26px;
        border-top: 1px solid #e3d8c3;
      }
      .url {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 30px;
        color: #2d2417;
      }
      .partner {
        font-size: 18px;
        color: #6b5d48;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: right;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #7ab648;
        display: block;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="bloom"></div>

    <div class="top">
      <img class="portrait" src="../public/images/family/aunt-mabel-face.jpg" alt="" />
      <div>
        <div class="wordmark">Aunt Mabel</div>
        <h1 class="headline">
          A friendly call every day — and <em>someone there</em> when it matters most.
        </h1>
      </div>
    </div>

    <div class="bottom">
      <div class="url">AuntMabel.app</div>
      <div class="partner">
        <span class="dot"></span>
        Born from years of Cajun Navy Ground Force disaster response
      </div>
    </div>
  </body>
</html>
